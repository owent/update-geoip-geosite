name: Build geoip.dat and geosite.dat

on:
  schedule:
    - cron: "0 0 * * 3"
  push:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Checkout geoip
        uses: actions/checkout@v7
        with:
          repository: v2fly/geoip
          path: repos/geoip
      - name: Checkout domain-list-community
        uses: actions/checkout@v7
        with:
          repository: v2fly/domain-list-community
          path: repos/domain-list-community
      - name: Set up Golang
        uses: actions/setup-go@v7
        with:
          go-version-file: repos/geoip/go.mod
          check-latest: true
          cache-dependency-path: repos/geoip/go.sum
        id: go
      - name: Get DB-IP Lite Country MMDB database
        run: |
          TAG_NAME="$(date +%Y%m%d%H%M)"
          RELEASE_NAME="$(date +%Y%m%d%H%M)"
          YEAR="$(date +%Y)"
          MONTH="$(date +%m)"
          mkdir -p "$GITHUB_WORKSPACE/geoip"
          cd "$GITHUB_WORKSPACE/geoip"
          curl -L -o dbip-country-lite.mmdb.gz "https://download.db-ip.com/free/dbip-country-lite-$YEAR-$MONTH.mmdb.gz"
          gzip -d dbip-country-lite.mmdb.gz
          mkdir -p "$GITHUB_WORKSPACE/repos/geoip/db-ip"
          mv dbip-country-lite*.mmdb "$GITHUB_WORKSPACE/repos/geoip/db-ip"/dbip-country-lite.mmdb
        shell: bash
      - name: Run build.sh
        run: |
          # Set GOPATH and release variables
          export TAG_NAME=$(date +%Y%m%d%H%M) ;
          export NAME=$(date +%Y%m%d%H%M) ;
          export GOPATH=$(dirname $GITHUB_WORKSPACE) ;
          export PATH="$(dirname $GITHUB_WORKSPACE)/bin:$PATH" ;
          mkdir -p "$GITHUB_WORKSPACE/geoip"
          curl -L "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-Country-CSV&license_key=$MAXMIND_LICENSE_KEY&suffix=zip" -o "$GITHUB_WORKSPACE/geoip/GeoLite2-Country-CSV.zip"
          bash $GITHUB_WORKSPACE/build.sh
          # Package categorized archives
          zip dat.zip *.dat *.dat.sha256sum
          tar -zcvf dat.tar.gz *.dat *.dat.sha256sum
          zip ipset.zip *.ipset
          tar -zcvf ipset.tar.gz *.ipset
          zip conf.zip *-blacklist.conf *-cn.conf
          tar -zcvf conf.tar.gz *-blacklist.conf *-cn.conf
          zip all.zip *.dat *.dat.sha256sum *.ipset *-blacklist.conf *-cn.conf
          tar -zcvf all.tar.gz *.dat *.dat.sha256sum *.ipset *-blacklist.conf *-cn.conf
          sha256sum *.zip *.tar.gz > sha256sums.txt
        shell: bash
        env:
          GOTOOLCHAIN: auto
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
      - name: Clean old release assets
        run: |
          KEEP="dat.zip dat.tar.gz ipset.zip ipset.tar.gz conf.zip conf.tar.gz all.zip all.tar.gz sha256sums.txt"
          gh release view latest --json assets --jq '.assets[].name' 2>/dev/null | while read -r asset; do
            skip=false
            for keep in $KEEP; do
              if [ "$asset" = "$keep" ]; then skip=true; break; fi
            done
            $skip || gh release delete-asset latest "$asset" -y || true
          done
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Release
        uses: xresloader/upload-to-github-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: "*.zip;*.tar.gz;sha256sums.txt"
          tags: true
          draft: false
          overwrite: true
          tag_name: latest
          update_latest_release: true
          verbose: true
